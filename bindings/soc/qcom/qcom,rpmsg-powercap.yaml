%YAML 1.2
---
$id: "http://devicetree.org/schemas/soc/qcom/qcom,rpmsg-powercap.yaml#"
$schema: "http://devicetree.org/meta-schemas/core.yaml#"

title: Qualcomm Technologies, Inc. QPT RPMSG Powercap Driver

maintainers:
  - Ajay Kumar Reddy Kathi <akathi@qti.qualcomm.com>

description: |
  Qualcomm QPT RPMSG powercap driver exposes powercap zones for system and
  CPU clusters, sends CAP/BAP/BWD limits over RPMSG/GLINK, and reads
  measured power values from shared memory.

properties:
  compatible:
    const: qcom,qptrpmsg

  qcom,glink-channels:
    description:
      GLINK channel name used for communication with the remote subsystem.
    items:
      - const: APPS_ADSP_PWR_LMTS_GLINK_PORT

  label:
    description:
      Remote subsystem label associated with this GLINK endpoint.
    const: adsp

required:
  - compatible
  - qcom,glink-channels
  - label

additionalProperties: false

examples:
  - |
    qpt_powercap: powercap {
        compatible = "qcom,qptrpmsg";
        qcom,glink-channels = "APPS_ADSP_PWR_LMTS_GLINK_PORT";
        label = "adsp";
    };
