%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/qcom,sm8350-camcc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm Camera Clock & Reset Controller for SM8350

maintainers:
  - Taniya Das <tdas@qti.qualcomm.com>
  - Vivek Aknurwar <vivek.aknurwar@oss.qualcomm.com>
  - Chetan C R <cchinnad@qti.qualcomm.com>

description: |
  Qualcomm camera clock control module which supports the clocks, resets and
  power domains on SM8350.

  See also dt-bindings/clock/qcom,camcc-sm8350.h

properties:
  compatible:
    enum:
      - qcom,sm8350-camcc
      - qcom,sm8350-camcc-v2

  clocks:
    items:
      - description: Board XO source
      - description: Board XO active source
      - description: Sleep clock source

  clock-names:
    items:
      - const: bi_tcxo
      - const: bi_tcxo_ao
      - const: sleep_clk

  '#clock-cells':
    const: 1

  '#reset-cells':
    const: 1

  reg:
    maxItems: 1

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - '#clock-cells'
  - '#reset-cells'

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/qcom,rpmh.h>
    clock-controller@ad00000 {
      compatible = "qcom,sm8350-camcc";
      reg = <0x0ad00000 0x10000>;
      clocks = <&rpmhcc RPMH_CXO_CLK>,
               <&rpmhcc RPMH_CXO_CLK_A>,
               <&sleep_clk>;
      clock-names = "bi_tcxo", "bi_tcxo_ao", "sleep_clk";
      #clock-cells = <1>;
      #reset-cells = <1>;
    };
...
