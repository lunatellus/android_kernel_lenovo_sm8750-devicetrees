%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/qcom,shikra-audiocorecc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm Technologies, Inc. Audio Core Clock Controller on Shikra SoCs

maintainers:
  - Imran Shaik <imran.shaik@oss.qualcomm.com>

description: |
  Audio core clock control module which supports the clocks and resets on Shikra.

  See also:
  - include/dt-bindings/clock/qcom,shikra-audiocorecc.h

properties:
  compatible:
    enum:
      - qcom,shikra-audiocorecc

  reg:
    maxItems: 1

  '#clock-cells':
    const: 1

  clocks:
    items:
      - description: Board XO source
      - description: GCC lpass config clock
      - description: GCC lpass core axim clock
      - description: Sleep clock source

  clock-names:
    items:
      - const: bi_tcxo
      - const: lpass_config_clk
      - const: lpass_core_axim_clk
      - const: sleep_clk

  vdd_cx-supply:
    description: Phandle pointer to the vdd_cx logic rail supply

required:
  - compatible
  - reg
  - '#clock-cells'
  - clocks
  - clock-names

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/qcom,shikra-audiocorecc.h>
    clock-controller@a0a0000 {
      #clock-cells = <1>;
      compatible = "qcom,shikra-audiocorecc";
      reg = <0x0a0a0000 0x10000>;
      clocks = <&rpmcc RPM_SMD_XO_CLK_SRC>,
               <&gcc GCC_LPASS_CONFIG_CLK>,
               <&gcc GCC_LPASS_CORE_AXIM_CLK>,
               <&sleep_clk>;
      clock-names = "bi_tcxo",
                    "lpass_config_clk",
                    "lpass_core_axim_clk",
                    "sleep_clk";
    };
