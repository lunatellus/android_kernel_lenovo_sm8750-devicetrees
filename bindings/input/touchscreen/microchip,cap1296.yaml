%YAML 1.2
---
$id: http://devicetree.org/schemas/input/touchscreen/microchip,cap1296.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Microchip CAP1296 capacitive touch controller

description: |
  CAP1296 is a capacitive touch controller connected over I2C.

maintainers:
  - Lynn Yang <lynnyang@qti.qualcomm.com>

properties:
  compatible:
    const: microchip,cap1296

  reg:
    description: Main I2C slave ID (for I2C host driver)

  vddio-supply:
    description: power supply for equipment

  interrupts:
    description: touch controller interrupt

  irq-gpio:
    description: description of GPIO interrupt

required:
  - compatible
  - reg
  - vddio-supply
  - interrupts
  - irq-gpio

additionalProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        cap1296@28 {
            compatible = "microchip,cap1296";
            status = "ok";
            reg = <0x28>;
            vddio-supply = <&L12C>;
            interrupt-parent = <&tlmm>;
            interrupts = <54 0>;
            irq-gpio = <&tlmm 54 GPIO_ACTIVE_LOW>;
        };
    };
