%YAML 1.2
---
$id: http://devicetree.org/schemas/rtc/qcom,rtc-glink.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm Technologies, Inc. RTC over GLINK

maintainers:
  - Subbaraman Narayanamurthy <quic_subbaram@quicinc.com>

description: |
  This binding describes the Qualcomm RTC interface exposed over GLINK.
  It is used for RTC time and alarm synchronization between the host and
  the remote processor.

properties:
  compatible:
    const: qcom,rtc-glink

  allow-set-time:
    $ref: /schemas/types.yaml#/definitions/flag
    description:
      Indicates that the setting of RTC time is allowed by the host CPU.

required:
  - compatible

additionalProperties: false

examples:
  - |
    qcom,pmic_glink {
        rtc_glink: qcom,rtc-glink {
            compatible = "qcom,rtc-glink";
        };
    };
