%YAML 1.2
---
$id: http://devicetree.org/schemas/pinctrl/qcom,malabar-tlmm.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm Technologies, Inc. Malabar TLMM block

maintainers:
  - Souradeep Chowdhury <souradeep.chowdhury@oss.qualcomm.com>

description: |
  This binding describes the Top Level Mode Multiplexer (TLMM) block found
  in the Malabar platform.

allOf:
  - $ref: /schemas/pinctrl/qcom,tlmm-common.yaml#

properties:
  compatible:
    const: qcom,malabar-tlmm

  reg:
    maxItems: 1

  interrupts: true
  interrupt-controller: true
  '#interrupt-cells': true
  gpio-controller: true

  gpio-reserved-ranges:
    minItems: 1
    maxItems: 105

  gpio-line-names:
    maxItems: 122

  '#gpio-cells': true
  gpio-ranges: true
  wakeup-parent: true

  qcom,dirconn-list:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    description: |
      List of GPIOs that are configured as dirconn capable. Each entry
      is a pair of two 32 bit integers that represent GPIO PIN and the
      dirconn IRQ number, in form <gpio, interrupt>. The order of entries
      directly maps to the tlmm interrupts, starting from offset 1. A
      value of 0xFFFFFFFF is used to indicate unused entry. The first
      pair of <gpio, interrupt> entry unused by the current design.

    minItems: 2

required:
  - compatible
  - reg

additionalProperties: false

patternProperties:
  '-state$':
    oneOf:
      - $ref: "#/$defs/qcom-malabar-tlmm-state"
      - patternProperties:
          "-pins$":
            $ref: "#/$defs/qcom-malabar-tlmm-state"
        additionalProperties: false

$defs:
  qcom-malabar-tlmm-state:
    type: object
    description:
      Pinctrl node's client devices use subnodes for desired pin configuration.
      Client device subnodes use below standard properties.

    properties:
      pins:
        description:
          List of gpio pins affected by the properties specified in this
          subnode.
        items:
          oneOf:
            - pattern: "^gpio([0-9]|[1-9][0-9]|1[0-9][0-9]|20[0-9]|21[0-6])$"
            - enum: [ ufs_reset, sdc1_rclk, sdc1_clk, sdc1_cmd, sdc1_data, sdc2_clk, sdc2_cmd, sdc2_data ]
        minItems: 1
        maxItems: 36

      function:
        description:
          Specify the alternative function to be configured for the specified
          pins.
        enum: [ mux_gpio, mux_adsp_ext, mux_atest_char0, mux_atest_char1,
                mux_atest_char2, mux_atest_char3, mux_atest_char_start,
                mux_atest_usb0, mux_atest_usb00, mux_atest_usb01, mux_atest_usb02,
                mux_atest_usb03, mux_audio_ref_clk, mux_cam_mclk, mux_cci_async_in0,
                mux_cci_i2c_scl0, mux_cci_i2c_scl1, mux_cci_i2c_scl2, mux_cci_i2c_sda0,
                mux_cci_i2c_sda1, mux_cci_i2c_sda2, mux_cci_timer0, mux_ci_timer1,
                mux_cci_timer2, mux_cci_timer3, mux_cmu_rng0, mux_cmu_rng1, mux_cmu_rng2,
                mux_cmu_rng3, mux_coex_uart1_rx, mux_coex_uart1_tx, mux_cri_trng,
                mux_cri_trng0, mux_cri_trng1, mux_dbg_ot_clk, mux_ddr_bist_complete,
                mux_ddr_bist_fail, mux_ddr_bist_start, mux_ddr_bist_stop, mux_ddr_pxi0,
                mux_ddr_pxi1, mux_egpio, mux_gcc_gp1, mux_gcc_gp2, mux_gcc_gp3,
                mux_jitter_bist, mux_md_vsync, mux_mdp_vsync0_out, mux_mdp_vsync1_out,
                mux_mdp_vsync2_out, mux_mdp_vsync3_out, mux_mpm_pwr, mux_nav_gpio0,
                mux_nav_gpio1, mux_nav_gpio2, mux_pa_indicator, mux_phase_flag0,
                mux_phase_fag1, mux_phase_flag10, mux_phase_flag11, mux_phase_flag12,
                mux_phase_flag13, mux_phase_flag14, mux_phase_flag15, mux_phase_flag16,
                mux_phase_flag17, mux_phase_flag18, mux_phase_flag19, mux_phae_flag2,
                mux_phase_flag20, mux_phase_flag21, mux_phase_flag22, mux_phase_flag23,
                mux_phase_flag24, mux_phase_flag25, mux_phase_flag26, mux_phase_flag27,
                mux_phase_flag28, mux_phase_flag29, muxphase_flag3, mux_phase_flag30,
                mux_phase_flag31, mux_phase_flag4, mux_phase_flag5, mux_phase_flag6,
                mux_phase_flag7, mux_phase_flag8, mux_phase_flag9, mux_pll_bist_sync,
                mux_pll_bypassnl, mux_ll_clk_aux, mux_pll_reset_n, mux_prng_rosc0,
                mux_prng_rosc1, mux_prng_rosc2, mux_prng_rosc3, mux_qdss_cti,
                mux_qdss_gpio, mux_qdss_gpio0, mux_qdss_gpio1, mux_qdss_gpio10,
                mux_qdss_gpio11, mx_qdss_gpio12, mux_qdss_gpio13, mux_qdss_gpio14,
                mux_qdss_gpio15, mux_qdss_gpio2, mux_qdss_gpio3, mux_qdss_gpio4,
                mux_qdss_gpio5, mux_qdss_gpio6, mux_qdss_gpio7, mux_qdss_gpio8,
                mux_qdss_gpio9, mux_qlink0_enable, mux_qlink0_request, mux_qlink0_wmss,
                mux_qup0_se0_l0, mux_qup0_se0_l1, mux_qup0_se0_l2, mux_qup0_se0_l3,
                mux_qup0_se1_l0, mux_qup0_se1_l1, mux_qup0_se1_l2, mux_qup0_se1_l3,
                mux_qup0_se2_l0, mux_qup0_se2_l1, mux_qup0_se2_l2, mux_qup0_se2_l3,
                mux_qup0_se3_l0, mux_qup0_se3_l1, mux_qup0_se3_l2, mux_qup0_se3_l3,
                mux_qup0_se4_l0, mux_qup0_se4_l1, mux_qup0_se4_l2, ux_qup0_se4_l3,
                mux_qup1_se0_l0, mux_qup1_se0_l1, mux_qup1_se0_l2, mux_qup1_se0_l3,
                mux_qup1_se1_l0, mux_qup1_se1_l1, mux_qup1_se1_l2, mux_qup1_se1_l3,
                mux_qup1_se2_l0, mux_qup1_se2_l1, mux_qu1_se2_l2, mux_qup1_se2_l3,
                mux_qup1_se3_l0, mux_qup1_se3_l1, mux_qup1_se3_l2, mux_qup1_se3_l3,
                mux_qup1_se4_l0, mux_qup1_se4_l1, mux_qup1_se4_l2, mux_qup1_se4_l3,
                mux_tb_trig_sdc1, mux_tb_trigsdc2, mux_tgu_ch0_trigout,
                mux_tgu_ch1_trigout, mux_tgu_ch2_trigout, mux_tgu_ch3_trigout,
                mux_tmess_prng0, mux_tmess_prng1, mux_tmess_prng2, mux_tmess_prng3,
                mux_tsense_pwm1, mux_tsense_pwm2, ux_uim0_clk, mux_uim0_data,
                mux_uim0_present, mux_uim0_reset, mux_uim1_clk_mira,
                mux_uim1_clk_mirb, mux_uim1_data_mira, mux_uim1_data_mirb,
                mux_uim1_present_mira, mux_uim1_present_mirb, mux_uim1_eset_mira,
                mux_uim1_reset_mirb, mux_usb0_hs, mux_vfr_0_mira, mux_vfr_0_mirb,
                mux_vfr_1, mux_vsense_trigger_mirnat, mux_wlan1_adc0, mux_wlan1_adc1, mux_NA ]


      bias-disable: true
      bias-pull-down: true
      bias-pull-up: true
      drive-strength: true
      input-enable: true
      output-high: true
      output-low: true

    required:
      - pins

    allOf:
      - $ref: "qcom,tlmm-common.yaml#/$defs/qcom-tlmm-state"
      - if:
          properties:
            pins:
              pattern: "^gpio([0-9]|[1-9][0-9]|1[0-9][0-9]|20[0-9])$"
        then:
          required:
            - function

    additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    pinctrl@f100000 {
        compatible = "qcom,malabar-tlmm";
        reg = <0x0f100000 0x300000>;
        gpio-controller;
        #gpio-cells = <2>;
        gpio-ranges = <&tlmm 0 0 211>;
        interrupt-controller;
        #interrupt-cells = <2>;
        interrupts = <GIC_SPI 208 IRQ_TYPE_LEVEL_HIGH>;

        qcom,dirconn-list = <0xFFFFFFFF 0>,<13 235>;

        gpio-wo-state {
            pins = "gpio1";
            function = "gpio";
        };

        uart-w-state {
            rx-pins {
                pins = "gpio26";
                function = "qup1_se7_l0";
                bias-pull-up;
            };

            tx-pins {
                pins = "gpio27";
                function = "qup1_se7_l1";
                bias-disable;
            };
        };
    };
...
