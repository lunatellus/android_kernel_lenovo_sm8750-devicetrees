%YAML 1.2
---
$id: http://devicetree.org/schemas/platform/msm/msm_gsi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm Technologies, Inc. GSI driver module

maintainers:
  - Qualcomm GSI Team <devicetree@qualcomm.com>

description: |
  GSI is a hardware accelerator that supports Generic Software Interfaces (GSI),
  which are peripheral specific (IPA in this case).
  This driver configures and communicates with the GSI hardware.

properties:
  compatible:
    const: qcom,msm_gsi

required:
  - compatible

unevaluatedProperties: false

examples:
  - |
    qcom,msm-gsi {
        compatible = "qcom,msm_gsi";
    };